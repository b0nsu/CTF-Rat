name: production-toolchain

on:
  schedule:
    - cron: '41 2 * * 1-5'
  workflow_dispatch:

# This runner is intentionally separate from PR CI: it exercises host tools
# that are too heavy and too environment-specific for GitHub-hosted workers.
# Its fixture corpus results are smoke evidence only, never release metrics.
jobs:
  real-tools:
    runs-on: [self-hosted, linux, ctf-toolchain]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert provisioned toolchain
        run: |
          command -v bwrap
          command -v gdb
          test -n "${GHIDRA_HOME:-}"
          test -x "$GHIDRA_HOME/support/analyzeHeadless"
          python3 -c 'import angr, pwn, qiling'
      - name: Contract and broker boundary tests
        env:
          RAT_REQUIRE_BWRAP: '1'
          RAT_BROKER_REQUIRE_SOCKET: '1'
          RAT_REQUIRE_BROKER_SOCKET: '1'
        run: |
          export RAT_BROKER_SOCKET="$RUNNER_TEMP/rat-broker.sock"
          export RAT_BROKER_KEY_PATH="$RUNNER_TEMP/rat-broker-receipt.key"
          export RAT_SHARED_STORE=1
          bin/rat-brokerd --socket "$RAT_BROKER_SOCKET" --allow-uid "$(id -u)" --ctf-home "$GITHUB_WORKSPACE" >"$RUNNER_TEMP/rat-broker.log" 2>&1 &
          broker_pid=$!
          trap 'kill "$broker_pid" 2>/dev/null || true; wait "$broker_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do test -S "$RAT_BROKER_SOCKET" && break; sleep 0.1; done
          test -S "$RAT_BROKER_SOCKET"
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tests/e2e_broker_sandbox.py
          python3 tests/e2e_broker_socket.py
          python3 tests/e2e_broker_verify.py
          python3 tests/e2e_orchestration.py --scenario converge
          python3 tests/e2e_orchestration.py --scenario invalidate-cancel
      - name: Representative real-tool smoke
        run: |
          python3 bin/revq selftest
          python3 solve/_template/rev/symsolve.py selftest
          python3 solve/_template/rev/vmlift.py selftest
          bash tests/e2e_rev.sh
          bin/rat-bench run --ablation A3 --seed 1 --cache cold --subset smoke --fixture-smoke
      - name: Mark fixture data non-release-evidence
        run: |
          bin/rat-bench validate-corpus --version v1
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'bin')
          from ratlib.benchmark import production_readiness
          assert not production_readiness(Path('benchmarks/corpus/v1'))['release_eligible']
          PY
