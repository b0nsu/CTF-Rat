name: desktop-workbench

on:
  push:
    branches: [desktop]
  pull_request:
    paths:
      - 'desktop/**'
      - 'bin/ratd'
      - 'bin/ratlib/desktop_*.py'
      - 'tests/test_desktop_*.py'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Desktop backend tests
        run: python3 -m unittest tests.test_desktop_api tests.test_desktop_session tests.test_desktop_http
      - name: Syntax check daemon modules
        run: python3 -m py_compile bin/ratd bin/ratlib/desktop_api.py bin/ratlib/desktop_session.py

  frontend-tauri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package.json
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential curl file libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: desktop
        run: npm run build
      - name: Rust compile check
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml
      - name: Capture generated lockfiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-lockfiles
          path: |
            desktop/package-lock.json
            desktop/src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 3
      - name: Sync generated lockfiles to desktop branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/desktop' && success()
        run: |
          if [[ -z "$(git status --porcelain -- desktop/package-lock.json desktop/src-tauri/Cargo.lock)" ]]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/package-lock.json desktop/src-tauri/Cargo.lock
          git commit -m 'desktop: lock npm and Cargo dependencies'
          git push origin HEAD:desktop
