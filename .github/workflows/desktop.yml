name: desktop-workbench

on:
  push:
    branches: [desktop]
  pull_request:
    paths:
      - 'desktop/**'
      - 'bin/ratd'
      - 'bin/ratlib/desktop_*.py'
      - 'tests/test_desktop_*.py'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Desktop backend tests
        run: python3 -m unittest tests.test_desktop_api tests.test_desktop_session tests.test_desktop_http tests.test_desktop_e2e
      - name: Syntax check daemon modules
        run: python3 -m py_compile bin/ratd bin/ratlib/desktop_api.py bin/ratlib/desktop_session.py

  frontend-tauri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential curl file libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        working-directory: desktop
        run: npm run build
      - name: Rust compile check
        run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Build Linux bundles
        if: github.event_name == 'pull_request'
        working-directory: desktop
        run: npm run tauri -- build --bundles deb,appimage
      - name: Verify lockfiles unchanged
        run: git diff --exit-code -- desktop/package-lock.json desktop/src-tauri/Cargo.lock
      - name: Upload Linux bundles
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ctf-rat-desktop-linux-${{ github.event.pull_request.head.sha }}
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
