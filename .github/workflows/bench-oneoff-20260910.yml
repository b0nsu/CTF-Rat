name: bench-oneoff-20260910

on:
  push:
    branches: [work/bench-measurement-20260910]

permissions:
  contents: write

jobs:
  measure-and-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/bench-measurement-20260910
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install benchmark toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gdb gcc sqlite3 strace
          python3 -m pip install --disable-pip-version-check -r requirements.txt
      - name: Apply ResourceWarning cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/test_ratbench_v2.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '            leaderboard = open(os.path.join(d, "bench", "LEADERBOARD.md"), encoding="utf-8").read()':
              '            with open(os.path.join(d, "bench", "LEADERBOARD.md"), encoding="utf-8") as fh:\n                leaderboard = fh.read()',
              '            leaderboard = open(os.path.join(d, "bench", "LEADERBOARD.v2.md"), encoding="utf-8").read()':
              '            with open(os.path.join(d, "bench", "LEADERBOARD.v2.md"), encoding="utf-8") as fh:\n                leaderboard = fh.read()',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match in {path}: {old!r}, got {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          path = Path('bin/ratlib/state_v2.py')
          text = path.read_text(encoding='utf-8')
          old = '  try: run_id=json.load(open(os.path.join(os.path.dirname(self.root),"run.json"),encoding="utf-8"))["run_id"]'
          new = '  try:\n   with open(os.path.join(os.path.dirname(self.root),"run.json"),encoding="utf-8") as f:\n    run_id=json.load(f)["run_id"]'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one checkpoint handle match, got {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Focused ResourceWarning regression
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/resource-warnings.log
          python3 -W always::ResourceWarning -m unittest discover -s tests -p 'test_ratbench_v2.py' 2>&1 | tee -a /tmp/resource-warnings.log
          python3 -W always::ResourceWarning -m unittest discover -s tests -p 'test_p1_contracts.py' 2>&1 | tee -a /tmp/resource-warnings.log
          python3 -W always::ResourceWarning tests/e2e_artifact_handoff.py 2>&1 | tee -a /tmp/resource-warnings.log
          if grep -q 'ResourceWarning' /tmp/resource-warnings.log; then
            echo 'ResourceWarning remained in focused regression' >&2
            exit 1
          fi
      - name: Full unit regression
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Synthetic benchmark regression
        run: python3 bin/ratbench run --corpus synthetic --run-id A-post-cleanup-20260910
      - name: Materialize pinned real corpus
        run: |
          PYTHONPATH=bin python3 -m ratlib.bench_artifacts bench/suite.json --corpus real
          find bench/artifacts -type f \( -name '*.bin' -o -perm -111 \) -print -exec file {} \;
      - name: Real Mode B harness smoke
        run: |
          cat > /tmp/ratbench-null-agent <<'PY'
          #!/usr/bin/env python3
          import os
          import sys
          challenge_dir = sys.argv[1]
          print('CTF-Rat real Mode B harness smoke:', os.path.basename(challenge_dir))
          PY
          chmod +x /tmp/ratbench-null-agent
          python3 bin/ratbench eval \
            --corpus real \
            --run-id B-real-harness-20260910 \
            --ablation A0 \
            --model-id harness-no-model \
            --reasoning-effort none \
            --timeout 30 \
            --agent '/tmp/ratbench-null-agent {dir}'
          python3 bin/ratbench report --schema v2
          cat bench/results/B-real-harness-20260910.benchmark-v2.jsonl
      - name: Check external model CLI availability
        run: |
          printf 'codex='; command -v codex || true
          printf 'claude='; command -v claude || true
      - uses: actions/upload-artifact@v4
        with:
          name: ctf-rat-real-harness-20260910
          path: |
            bench/results/B-real-harness-20260910.jsonl
            bench/results/B-real-harness-20260910.benchmark-v2.jsonl
            bench/LEADERBOARD.v2.md
            /tmp/resource-warnings.log
          if-no-files-found: error
      - name: Commit cleanup only and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/bench-oneoff-20260910.yml
          git add tests/test_ratbench_v2.py bin/ratlib/state_v2.py
          git diff --cached --check
          git commit -m 'fix(tests): close benchmark and checkpoint file handles'
          git push origin HEAD:work/bench-measurement-20260910
