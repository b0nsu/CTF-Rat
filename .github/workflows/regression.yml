name: operational-regression

on:
  pull_request:
  push:
    branches: ['**']
  schedule:
    - cron: '0 4 * * *'   # nightly deep run
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y gdb
      - run: python3 -m pip install --disable-pip-version-check -r requirements.txt
      # tool selftests (pure logic, no angr — see bin/revq "Mac selftest 격리")
      - run: python3 bin/rat selftest
      - run: python3 bin/revq selftest
      - run: python3 solve/_template/rev/symsolve.py selftest
      - run: python3 solve/_template/rev/vmlift.py selftest
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 tests/e2e_artifact_handoff.py
      - run: python3 tests/e2e_analysis.py --category core
      - run: python3 tests/e2e_orchestration.py --scenario converge
      - run: python3 tests/e2e_orchestration.py --scenario invalidate-cancel
      - run: python3 tests/e2e_orchestration.py --scenario verified-only-exploit
      - run: python3 tests/e2e_orchestration.py --scenario skeptic-refute
      - run: bin/pkselftest --format json

  # angr-backed integration: real ELF Function Card / oracle wiring / data
  # slice / custom-store index registration + governor STATE separation, plus
  # the crackme e2e. Kept OFF the every-push fast path (heavy angr install);
  # runs on PRs to main, nightly, and manual dispatch. The fast `regression`
  # job stays authoritative for pure/unit/operational coverage.
  analysis-deep:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y gdb gcc sqlite3
      - run: python3 -m pip install --disable-pip-version-check -r requirements-deep.txt
      - run: python3 -c "import angr; print('angr', angr.__version__)"
      # angr-gated cases in the suite unskip once angr+gcc+Linux are present
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: bash tests/e2e_rev.sh
