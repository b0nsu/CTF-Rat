name: model-b-real-20260915

on:
  push:
    branches:
      - bench/model-b-real-20260915
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  model-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bench/model-b-real-20260915
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Copilot CLI only
        run: npm install -g @github/copilot

      - name: Capture Auto model metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          copilot --version | tee /tmp/copilot-version.txt
          copilot \
            -p 'This is an authentication and model-selection probe. Reply exactly: CTF_RAT_MODEL_READY' \
            --model=auto \
            --no-ask-user \
            --disable-builtin-mcps \
            --excluded-tools='web_fetch' \
            --output-format=json \
            --share=/tmp/model-auto-session.md \
            | tee /tmp/model-auto-probe.jsonl
          grep -q 'CTF_RAT_MODEL_READY' /tmp/model-auto-probe.jsonl
          echo '--- JSONL ---'
          cat /tmp/model-auto-probe.jsonl
          echo '--- SESSION ---'
          cat /tmp/model-auto-session.md

      - name: Upload model probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctf-rat-model-probe-20260915
          retention-days: 90
          if-no-files-found: warn
          path: |
            /tmp/copilot-version.txt
            /tmp/model-auto-probe.jsonl
            /tmp/model-auto-session.md
