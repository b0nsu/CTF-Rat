name: model-b-real-20260915

on:
  push:
    branches:
      - bench/model-b-real-20260915
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  model-b-real:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CTF_RAT_BASE_REVISION: 304cf273f0e5ab3fc073563922d89b8966c2119c
      BENCH_RUN_ID: B-real-claude-sonnet-46-20260915
      MODEL_B_MODEL: claude-sonnet-4.6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bench/model-b-real-20260915
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install CTF-Rat benchmark toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gdb gcc sqlite3 strace file
          python3 -m pip install --disable-pip-version-check -r requirements-deep.txt
          npm install -g @github/copilot

      - name: Verify benchmark source revision and materialize real corpus
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/dev)" = "$CTF_RAT_BASE_REVISION"
          PYTHONPATH=bin python3 -m ratlib.bench_artifacts bench/suite.json --corpus real
          find bench/artifacts -type f -name '*.bin' -print -exec file {} \;

      - name: Verify actual fixed-model authentication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          copilot --version | tee /tmp/copilot-version.txt
          copilot \
            -p 'This is an authentication and model-selection preflight. Reply exactly: CTF_RAT_MODEL_READY' \
            --model="$MODEL_B_MODEL" \
            --no-ask-user \
            --disable-builtin-mcps \
            --excluded-tools='web_fetch,web_search' \
            | tee /tmp/model-preflight.txt
          grep -q 'CTF_RAT_MODEL_READY' /tmp/model-preflight.txt

      - name: Create measured Copilot agent wrapper
        run: |
          cat > /tmp/ctf-rat-model-agent <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec copilot \
            --experimental --sandbox \
            -p 'You are the solver in a measured CTF-Rat Mode B evaluation. Solve the CTF challenge in the current working directory using only local files and the provided CTF-Rat runtime. Do not use the network or external sources. Read and follow $CTF_HOME/AGENTS.md before solving. Start with bounded routing and analysis, maintain canonical STATE evidence, establish and validate a real primitive, and use deterministic verification. A flag-shaped string alone is not success: do not claim solved unless the canonical completion gate is VERIFIED. Leave all state, evidence, scripts, and verification artifacts in the challenge workspace.' \
            --model "$MODEL_B_MODEL" \
            --no-ask-user \
            --allow-all-tools \
            --excluded-tools='web_fetch,web_search' \
            --disable-builtin-mcps
          SH
          chmod +x /tmp/ctf-rat-model-agent

      - name: Run actual Mode B over pinned real corpus
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CTF_RAT_REVISION: 304cf273f0e5ab3fc073563922d89b8966c2119c
        run: |
          set -euo pipefail
          /usr/bin/time -f 'MODEL_B wall_sec=%e user_sec=%U sys_sec=%S maxrss_kb=%M' \
            python3 bin/ratbench eval \
              --corpus real \
              --run-id "$BENCH_RUN_ID" \
              --ablation A0 \
              --model-id "$MODEL_B_MODEL" \
              --reasoning-effort default \
              --timeout 600 \
              --agent '/tmp/ctf-rat-model-agent' \
            | tee /tmp/mode-b-console.txt

      - name: Render and validate benchmark-v2 report
        run: |
          set -euo pipefail
          python3 bin/ratbench report --schema v2 | tee /tmp/benchmark-report.txt
          cat "bench/results/${BENCH_RUN_ID}.jsonl"
          cat "bench/results/${BENCH_RUN_ID}.benchmark-v2.jsonl"
          cat bench/LEADERBOARD.v2.md

      - name: Upload Mode B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctf-rat-model-b-real-20260915
          retention-days: 90
          if-no-files-found: warn
          path: |
            bench/results/B-real-claude-sonnet-46-20260915.jsonl
            bench/results/B-real-claude-sonnet-46-20260915.benchmark-v2.jsonl
            bench/LEADERBOARD.v2.md
            /tmp/copilot-version.txt
            /tmp/model-preflight.txt
            /tmp/mode-b-console.txt
            /tmp/benchmark-report.txt
